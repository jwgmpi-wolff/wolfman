[package]
name = "wolfman-windows"
version = "1.0.0"
description = "Wolfman desktop shell: tray, hotkey, presence overlay"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "wolfman-windows"
path = "src/main.rs"
